# flex — Cargo workspace root.
#
# Two members, one repo:
#
#   flex-core   the reusable TUI menu engine (rendering, filtering, keys,
#               design system, kitty-graphics previews). No machine-specific
#               paths; stays publishable.
#   flex-rice   this rice's glue: the providers that adapt
#               hyprpaper/cliphist/nmcli/wpctl/proc/… to the engine, the
#               `flex` dispatcher, and the `flex-<provider>` provider
#               binaries plus the `flex-record` helper that Hyprland and
#               Waybar call. Machine-specific by nature (`publish = false`).
#
# Dependencies run one way (`flex-rice` → `flex-core`, a path dependency —
# no tags, no `[patch]` dance). Profiles and lints are honoured only here.

[workspace]
members = ["flex-core", "flex-rice"]
resolver = "2"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["flex contributors"]
repository = "https://github.com/gom3az/flex"

[workspace.dependencies]
flex-core = { path = "flex-core" }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# Non-CJK widths: narrow ambiguous codepoints (no `cjk` feature).
unicode-width = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

# Profiles are only honoured at the workspace root: member `[profile.*]`
# sections are ignored, so this is the single definition.
[profile.release]
lto = true
strip = true
panic = "abort"
